    <!-- vCard Generation Logic -->
    <script>
        function downloadVCard() {
            const vcardData = `BEGIN:VCARD
VERSION:3.0
FN:Farhan Saif Chowdhury
N:Chowdhury;Farhan;Saif;;
ORG:Shimanto Bank PLC
TITLE:Associate Manager, Information Security & IT Governance
TEL;TYPE=WORK,VOICE:+8801617314151
EMAIL;TYPE=HOME:farhansaif20@gmail.com
EMAIL;TYPE=WORK:farhan.saif@shimantobank.com
URL:https://www.linkedin.com/in/farhansaifchowdhury/
ADR;TYPE=WORK:;;;Dhaka;;;Bangladesh
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);

            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'Farhan_Saif_Chowdhury.vcf');
            document.body.appendChild(link);
            link.click();

            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);
        }
    </script>
